# ==============================================================================
# Aeternum PremiApp Bot - Production Nginx Reverse Proxy Configuration
# Rate Limiting, SSL Hardening, and Secure Webhook Proxying
# ==============================================================================

# Rate Limiting Zones (Anti-DDoS Webhook)
limit_req_zone $binary_remote_addr zone=aeternum_webhook_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=aeternum_general_limit:10m rate=30r/s;

server {
    listen 80;
    server_name api.yourdomain.com; # Ganti dengan domain/subdomain Anda

    # Redirect seluruh lalu lintas HTTP ke HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.yourdomain.com; # Ganti dengan domain/subdomain Anda

    # Sertifikat SSL (Let's Encrypt / Cloudflare Origin)
    ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;

    # SSL Hardening Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Endpoint Webhook Payment Gateway QRIS
    location /webhook/payment {
        # Batasi rate limit: max 10 req/detik, burst 20
        limit_req zone=aeternum_webhook_limit burst=20 nodelay;

        # Proxy ke FastAPI Uvicorn Server
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Meneruskan Real IP ke FastAPI
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Health Check Endpoint
    location / {
        limit_req zone=aeternum_general_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
