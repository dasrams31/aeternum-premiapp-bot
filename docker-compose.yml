version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aeternum_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: aeternum_premiapp_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    networks:
      - aeternum_net

  bot:
    build: .
    container_name: aeternum_bot
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:secretpassword@postgres:5432/aeternum_premiapp_db
    ports:
      - "8000:8000"
    networks:
      - aeternum_net

volumes:
  pgdata:

networks:
  aeternum_net:
    driver: bridge
